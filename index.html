<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D FPS with PointerLock (Modules)</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #87CEEB; }
    #ui { position: absolute; top: 10px; left: 10px; z-index: 10; color: white; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 4px; font-family: sans-serif; }
    #settings { position: absolute; top: 80px; left: 10px; z-index: 10; background: rgba(0,0,0,0.7); color: white; padding: 10px; border-radius: 4px; display: none; }
    #settings label { display: block; margin: 6px 0; }
    #settings input[type="text"], #settings input[type="number"] { width: 60px; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="sprintStatus">Sprint: OFF</div>
    <div id="crouchStatus">Crouch: OFF</div>
    <div id="instr">Click to lock mouse & start</div>
  </div>
  <div id="settings">
    <label>Mouse Sensitivity: <input type="number" id="sens" step="0.1" min="0.1" max="5"></label>
    <label>Sprint Key: <input type="text" id="keySprint" maxlength="1"></label>
    <label>Crouch Key: <input type="text" id="keyCrouch" maxlength="1"></label>
    <button id="saveSettings">Save Settings</button>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js';
    import { PointerLockControls } from 'https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/PointerLockControls.js';

    // --- Settings & LocalStorage ---
    const defaultSettings = { sensitivity: 1.0, keySprint: 'Shift', keyCrouch: 'C' };
    let settings = JSON.parse(localStorage.getItem('fpsSettings')) || defaultSettings;

    const sensInput = document.getElementById('sens');
    const keySprintInput = document.getElementById('keySprint');
    const keyCrouchInput = document.getElementById('keyCrouch');
    const saveBtn = document.getElementById('saveSettings');
    const settingsDiv = document.getElementById('settings');
    const instrDiv = document.getElementById('instr');
    const sprintStatus = document.getElementById('sprintStatus');
    const crouchStatus = document.getElementById('crouchStatus');

    sensInput.value = settings.sensitivity;
    keySprintInput.value = settings.keySprint;
    keyCrouchInput.value = settings.keyCrouch;

    saveBtn.addEventListener('click', () => {
      settings.sensitivity = parseFloat(sensInput.value) || 1;
      settings.keySprint = keySprintInput.value.toUpperCase() || defaultSettings.keySprint;
      settings.keyCrouch = keyCrouchInput.value.toUpperCase() || defaultSettings.keyCrouch;
      localStorage.setItem('fpsSettings', JSON.stringify(settings));
      alert('Settings saved');
    });

    document.addEventListener('keydown', e => {
      if (e.code === 'Escape') {
        settingsDiv.style.display = settingsDiv.style.display === 'none' ? 'block' : 'none';
      }
    });

    // --- Three.js Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- Terrain ---
    const loader = new THREE.TextureLoader();
    const grass = loader.load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
    grass.wrapS = grass.wrapT = THREE.RepeatWrapping;
    grass.repeat.set(50, 50);

    const groundGeo = new THREE.PlaneGeometry(500, 500);
    const groundMat = new THREE.MeshStandardMaterial({ map: grass });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // --- Sun Light ---
    const sun = new THREE.DirectionalLight(0xffff88, 1.5);
    sun.position.set(100, 200, 100);
    sun.castShadow = true;
    sun.shadow.mapSize.width = sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    // --- Controls / Player State ---
    const controls = new PointerLockControls(camera, document.body);
    document.body.addEventListener('click', () => {
      controls.lock();
      instrDiv.style.display = 'none';
    });

    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let isSprinting = false, isCrouching = false, canJump = false;

    const keyState = {};
    document.addEventListener('keydown', (e) => keyState[e.code] = true);
    document.addEventListener('keyup', (e) => keyState[e.code] = false);

    // --- Animation / Physics Loop ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      velocity.y -= 9.8 * delta;

      direction.x = 0;
      direction.z = 0;
      if (keyState['KeyW']) direction.z -= 1;
      if (keyState['KeyS']) direction.z += 1;
      if (keyState['KeyA']) direction.x -= 1;
      if (keyState['KeyD']) direction.x += 1;
      direction.normalize();

      isSprinting = keyState[settings.keySprint] || keyState['ShiftLeft'];
      isCrouching = keyState[settings.keyCrouch] || keyState['KeyC'];

      let speed = 5;
      if (isSprinting) speed = 10;
      if (isCrouching) speed = 2.5;

      if (direction.length() > 0) {
        velocity.x -= direction.x * speed * delta;
        velocity.z -= direction.z * speed * delta;
      }

      if (keyState['Space'] && canJump) {
        velocity.y = 8;
        canJump = false;
      }

      controls.moveRight(-velocity.x * delta);
      controls.moveForward(-velocity.z * delta);

      camera.position.y += velocity.y * delta;
      const crouchHeight = isCrouching ? 1.0 : 2.0;
      if (camera.position.y < crouchHeight) {
        velocity.y = 0;
        camera.position.y = crouchHeight;
        canJump = true;
      }
      // Smooth crouch / uncrouch
      camera.position.y += (crouchHeight - camera.position.y) * 5 * delta;

      sprintStatus.innerText = `Sprint: ${isSprinting ? 'ON' : 'OFF'}`;
      crouchStatus.innerText = `Crouch: ${isCrouching ? 'ON' : 'OFF'}`;

      renderer.render(scene, camera);
    }
    animate();

    // --- Mouse Look ---
    controls.addEventListener('lock', () => {
      document.addEventListener('mousemove', onMouseMove);
    });
    controls.addEventListener('unlock', () => {
      document.removeEventListener('mousemove', onMouseMove);
    });

    function onMouseMove(event) {
      const dx = event.movementX;
      const dy = event.movementY;
      if (Math.abs(dx) > Math.abs(dy)) {
        controls.getObject().rotation.y -= dx * 0.002 * settings.sensitivity;
      } else {
        camera.rotation.x -= dy * 0.002 * settings.sensitivity;
        camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
      }
    }

    // --- Window Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
