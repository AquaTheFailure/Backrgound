<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Three.js FPS Flat Terrain</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #87CEEB; /* fallback sky */
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #instructions {
            color: white;
            text-align: center;
            cursor: pointer;
        }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            z-index: 5;
        }
    </style>
</head>
<body>
<div id="blocker">
    <div id="instructions">
        <h1>Click to play</h1>
        <p>(W, A, S, D = Move, SPACE = Jump, SHIFT = Sprint, C = Crouch, MOUSE = Look around)</p>
    </div>
</div>
<div id="hud">
    Sprint: OFF<br>
    Crouch: OFF
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r153/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r153/examples/js/controls/PointerLockControls.js"></script>
<script>
let camera, scene, renderer;
let controls, raycaster;
let objects = [];
let blocker = document.getElementById('blocker');
let instructions = document.getElementById('instructions');
let hud = document.getElementById('hud');

let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let canJump = false;
let isSprinting = false, isCrouching = false;

let velocity = new THREE.Vector3();
let direction = new THREE.Vector3();
let clock = new THREE.Clock();

const SPEED = 400;
const JUMP_SPEED = 350;
const CROUCH_HEIGHT = 1;

init();
animate();

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Sky blue
    scene.fog = new THREE.Fog(0x87CEEB, 0, 1000);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 1, 2000);

    // Light (sun)
    const sun = new THREE.DirectionalLight(0xffff88, 1);
    sun.position.set(100, 400, 100);
    sun.castShadow = true;
    scene.add(sun);

    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // PointerLockControls
    controls = new THREE.PointerLockControls(camera, document.body);
    scene.add(controls.getObject());

    // Pointer lock
    instructions.addEventListener('click', function () {
        controls.lock();
    });

    controls.addEventListener('lock', () => {
        blocker.style.display = 'none';
    });
    controls.addEventListener('unlock', () => {
        blocker.style.display = 'flex';
    });

    // Floor (flat terrain)
    const textureLoader = new THREE.TextureLoader();
    const grassTexture = textureLoader.load('https://threejs.org/examples/textures/grasslight-big.jpg');
    grassTexture.wrapS = grassTexture.wrapT = THREE.RepeatWrapping;
    grassTexture.repeat.set(100, 100);

    const floorGeometry = new THREE.PlaneGeometry(2000, 2000);
    const floorMaterial = new THREE.MeshStandardMaterial({ map: grassTexture });
    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI/2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Raycaster for ground detection
    raycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(0, -1, 0), 0, 10);

    // Events
    const onKeyDown = function (event) {
        switch(event.code){
            case 'ArrowUp':
            case 'KeyW': moveForward = true; break;
            case 'ArrowLeft':
            case 'KeyA': moveLeft = true; break;
            case 'ArrowDown':
            case 'KeyS': moveBackward = true; break;
            case 'ArrowRight':
            case 'KeyD': moveRight = true; break;
            case 'ShiftLeft': isSprinting = true; break;
            case 'Space': if (canJump) velocity.y += JUMP_SPEED; canJump = false; break;
            case 'KeyC': isCrouching = true; break;
        }
        updateHUD();
    };

    const onKeyUp = function (event) {
        switch(event.code){
            case 'ArrowUp':
            case 'KeyW': moveForward = false; break;
            case 'ArrowLeft':
            case 'KeyA': moveLeft = false; break;
            case 'ArrowDown':
            case 'KeyS': moveBackward = false; break;
            case 'ArrowRight':
            case 'KeyD': moveRight = false; break;
            case 'ShiftLeft': isSprinting = false; break;
            case 'KeyC': isCrouching = false; break;
        }
        updateHUD();
    };

    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);

    window.addEventListener('resize', onWindowResize);
}

function updateHUD(){
    hud.innerHTML = `Sprint: ${isSprinting ? 'ON' : 'OFF'}<br>Crouch: ${isCrouching ? 'ON' : 'OFF'}`;
}

function onWindowResize(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate(){
    requestAnimationFrame(animate);

    const delta = clock.getDelta();
    const speed = (isSprinting ? 2 : 1) * SPEED * delta;

    velocity.x -= velocity.x * 10.0 * delta;
    velocity.z -= velocity.z * 10.0 * delta;
    velocity.y -= 9.8 * 100.0 * delta; // gravity

    direction.z = Number(moveForward) - Number(moveBackward);
    direction.x = Number(moveRight) - Number(moveLeft);
    direction.normalize();

    if(moveForward || moveBackward) velocity.z -= direction.z * speed;
    if(moveLeft || moveRight) velocity.x -= direction.x * speed;

    controls.moveRight(-velocity.x * delta);
    controls.moveForward(-velocity.z * delta);
    controls.getObject().position.y += velocity.y * delta;

    // ground collision
    if(controls.getObject().position.y < 10){
        velocity.y = 0;
        controls.getObject().position.y = 10;
        canJump = true;
    }

    // crouch animation
    controls.getObject().scale.y = isCrouching ? 0.5 : 1;

    renderer.render(scene, camera);
}
</script>
</body>
</html>
